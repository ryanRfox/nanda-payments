version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nanda-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nanda_development
    networks:
      - nanda-dev-network

  facilitator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nanda-facilitator-dev
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=nanda_development
      - SESSION_EXPIRATION_MINUTES=60
      - PERIODIC_CLEANUP_MINUTES=30
      - LOG_LEVEL=debug
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005
    volumes:
      # Hot reload for development
      - ./packages/facilitator/src:/app/packages/facilitator/src
      - ./packages/sdk/src:/app/packages/sdk/src
    networks:
      - nanda-dev-network

networks:
  nanda-dev-network:
    driver: bridge

volumes:
  mongodb_dev_data:
    driver: local