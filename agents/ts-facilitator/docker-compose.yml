version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nanda-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-secure-password}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-nanda_facilitator}
    networks:
      - nanda-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  facilitator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanda-facilitator
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=${MONGO_DB_NAME:-nanda_facilitator}
      - SESSION_EXPIRATION_MINUTES=${SESSION_EXPIRATION_MINUTES:-30}
      - PERIODIC_CLEANUP_MINUTES=${PERIODIC_CLEANUP_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    networks:
      - nanda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: nanda-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - facilitator
    networks:
      - nanda-network

networks:
  nanda-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local